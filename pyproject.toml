[project]
name = "m31"
version = "0.1.0"
description = "Foundation-model fusion for lung adenocarcinoma subtyping (CLWD)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep learning stack. torch 2.8 is the newest release with a prebuilt
    # flash-attn wheel (hard requirement of Prism2); CUDA 12.8 runtime wheels.
    "torch==2.8.0",
    "torchvision==0.23.0",
    "timm==1.0.30",
    # transformers 4.x: Prism2's remote code targets the 4.51+ API.
    "transformers==4.57.6",
    "safetensors>=0.6",
    "einops>=0.8",
    "flash-attn",
    # Hub access + data handling
    "huggingface-hub>=0.34,<1",
    "numpy>=2",
    "pandas>=2.2",
    "pillow>=11",
    "scikit-learn>=1.9.1",
    "pyyaml>=6.0.3",
    "pyvips[binary]>=3.2.0",
    "scipy>=1.18.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post2/flash_attn-2.8.3.post2+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
